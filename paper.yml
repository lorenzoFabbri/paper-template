# paper.yml — the only file a new paper edits.
#
# Read twice: Pandoc consumes the whole file as --metadata-file, and the
# Makefile reads the `build:` block with yq. Everything Pandoc does not
# recognise it ignores, so build settings and manuscript metadata coexist here
# rather than being split across a Makefile, a metadata file and the shell.
#
# `make init` fills this in from what it asks you. Editing it by hand is the
# same thing done slower.

title: ""
short-title: ""

# Author keys, all of which are rendered. Normalised by
# engine/filters/scholarly-metadata.lua, laid out by
# engine/filters/author-info-blocks.lua:
#
#   name               full name as it should appear in the byline
#   institute          list of ids from the `institute:` block below; order
#                      determines the superscript affiliation markers
#   correspondence     marks the corresponding author; needs `email`
#   email              emitted as a mailto link in the correspondence block
#   equal_contributor  shared first or last authorship; adds a footnote mark
#                      and an "authors contributed equally" note
#   orcid              bare iD or full https://orcid.org/ URL, either accepted;
#                      listed in an ORCID block under the correspondence line
author:
  - name: ""
    institute: [inst1]
    correspondence: true
    email: ""
    orcid: ""

# Institute keys: `id`, referenced by authors above, and `name`. The numeric
# superscript index is assigned in declaration order.
institute:
  - id: inst1
    name: ""

keywords: []

build:
  # Journal key → engine/styles/submission-rules/<journal>.yml. Drives
  # `make submit`: file naming and required checklists.
  journal: aje

  # Citation style → engine/styles/<csl>.csl.
  csl: vancouver

  # Typst theme → engine/templates/typst/<typst-theme>.typ.
  typst-theme: default

  # Better BibTeX collection name, used by `make bib` and `make docx-live`.
  # Give the full path from the library root; leave empty if you maintain
  # references.bib by hand.
  zotero-collection: ""

  # Limits for the journal above, copied from its author instructions when you
  # choose it. `make submit` checks the manuscript against them and refuses to
  # package a paper that exceeds one. Leave a limit empty to skip that check.
  #
  # They live here rather than in the journal profile because a limit read from
  # a publisher's page goes stale, and the person who can tell whether it is
  # still right is the one about to submit.
  limits:
    abstract: ~
    main_text: ~
    references: ~
